services:
  # --- Backend: Express API ---
  - type: web
    name: scuml-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Predicted from this blueprint's frontend service name below. If Render
      # assigns a different URL (e.g. the name was already taken), update this
      # to match the frontend's actual URL.
      - key: FRONTEND_URL
        value: https://scuml-frontend.onrender.com
      - key: SESSION_NAME
        value: scuml.sid
      - key: SESSION_SECRET
        generateValue: true
      # Secrets — not stored in this file, set once in the Render dashboard.
      - key: MONGO_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional — only needed once ClamAV is actually stood up (see the
      # "Ship without scanning" decision made for this deploy). Leave unset
      # and uploads simply go unscanned, same as local dev.
      # - key: CLAMAV_HOST
      #   sync: false
      # - key: CLAMAV_PORT
      #   value: "3310"

  # --- Frontend: Next.js app ---
  - type: web
    name: scuml-frontend
    runtime: node
    rootDir: scuml-frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Re-applying the proxy approach — verified working by running this
      # exact rewrite locally against the real production backend (proxied
      # /api/csrf-token through successfully, got a valid token + cookie
      # back). The earlier production failure was very likely BACKEND_ORIGIN
      # never actually reaching the live service, not a bug in this config —
      # Render's Blueprint auto-sync can be unreliable about adding a
      # brand-new env var key to an already-existing service. This time,
      # manually verify both values in the Render dashboard's Environment
      # tab BEFORE testing, rather than assuming sync applied them.
      #
      # Empty on purpose — every axios call does
      # `${NEXT_PUBLIC_BACKEND_URL}/api/...`, so an empty value turns those
      # into relative paths (e.g. "/api/auth/login"), meaning the browser
      # calls this frontend's own domain instead of the backend's directly.
      # The rewrites() in next.config.ts then proxies /api/* to the real
      # backend server-side. This is what makes the session/CSRF cookies
      # first-party from the browser's point of view — required for Safari
      # on iOS, which blocks cross-site cookies even with SameSite=None.
      - key: NEXT_PUBLIC_BACKEND_URL
        value: ""
      # Server-only (no NEXT_PUBLIC_ prefix — never sent to the browser).
      # This is where next.config.ts's rewrite actually forwards /api/* to.
      # Predicted from the backend service name above — update if Render
      # assigned a different URL.
      - key: BACKEND_ORIGIN
        value: https://scuml-backend.onrender.com
      - key: NEXT_PUBLIC_DEFAULT_AVATAR_URL
        sync: false
