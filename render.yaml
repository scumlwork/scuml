services:
  # --- Backend: Express API ---
  - type: web
    name: scuml-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://myscumlwork.me
      - key: SESSION_NAME
        value: scuml.sid
      - key: SESSION_SECRET
        generateValue: true
      # Secrets — not stored in this file, set once in the Render dashboard.
      - key: MONGO_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Shared secret for the external monthly cleanup ping (deletes
      # generated-letter PDFs older than 30 days from Cloudinary) — see
      # /api/maintenance/cleanup-generated-letters. Set the same value here
      # and in the cron service's request header.
      - key: CLEANUP_SECRET
        sync: false
      # Sends generated letters as real email attachments (see
      # /api/letters/send-letter-email). EMAIL_USER is the Gmail address;
      # EMAIL_PASS is a Google App Password for it, not its login password.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Optional — only needed once ClamAV is actually stood up (see the
      # "Ship without scanning" decision made for this deploy). Leave unset
      # and uploads simply go unscanned, same as local dev.
      # - key: CLAMAV_HOST
      #   sync: false
      # - key: CLAMAV_PORT
      #   value: "3310"

  # --- Frontend: Next.js app ---
  - type: web
    name: scuml-frontend
    runtime: node
    rootDir: scuml-frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Now on a custom subdomain of the same parent domain as the frontend
      # (myscumlwork.me / api.myscumlwork.me) — same "site" per browser
      # cookie rules, which fixes iOS Safari's cross-site cookie blocking
      # properly, without needing the Next.js proxy workaround that was
      # attempted and abandoned earlier (see git history).
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://api.myscumlwork.me
      - key: NEXT_PUBLIC_DEFAULT_AVATAR_URL
        sync: false
